<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RV Realty Admin Dashboard</title>

<link rel="stylesheet" href="css/dashboard.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="sidebar">

<div class="logo">

<h2>RV Realty</h2>

<p>Admin Panel</p>

</div>

<ul>

<li class="active">
<i class="fas fa-home"></i>
Dashboard
</li>

<li>
<i class="fas fa-building"></i>
Projects
</li>

<li>
<i class="fas fa-image"></i>
Gallery
</li>

<li>
<i class="fas fa-envelope"></i>
Contacts
</li>

<li>
<i class="fas fa-user"></i>
Profile
</li>

<li id="logoutBtn">
<i class="fas fa-right-from-bracket"></i>
Logout
</li>

</ul>

</div>

<div class="main">

<div class="topbar">

<h1>Dashboard</h1>

<div class="admin">

<i class="fas fa-user-circle"></i>

<span>Administrator</span>

</div>

</div>

<div class="cards">

<div class="card">

<i class="fas fa-building"></i>

<h3>Projects</h3>

<h2 id="projectCount">0</h2>

</div>

<div class="card">

<i class="fas fa-image"></i>

<h3>Gallery</h3>

<h2 id="galleryCount">0</h2>

</div>

<div class="card">

<i class="fas fa-envelope"></i>

<h3>Contacts</h3>

<h2 id="contactCount">0</h2>

</div>

<div class="card">

<i class="fas fa-eye"></i>

<h3>Visitors</h3>

<h2>540</h2>

</div>

</div>

<div class="chartBox">

<h2>Website Statistics</h2>

<canvas id="dashboardChart"></canvas>

</div>

<div class="tables">

<div class="tableBox">

<h2>Projects</h2>

<ul id="projectList"></ul>

<input
type="text"
id="projectName"
placeholder="New Project">

<button id="addProject">

Add Project

</button>

</div>

<div class="tableBox">

<h2>Recent Enquiries</h2>

<table id="contactTable">

<thead>

<tr>

<th>Name</th>

<th>Phone</th>

<th>Date</th>

</tr>

</thead>

<tbody>

</tbody>

</table>

</div>

</div>

</div>

<script src="js/dashboard.js"></script>

<script src="js/charts.js"></script>

</body>

</html>
